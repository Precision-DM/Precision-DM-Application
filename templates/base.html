<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}M3 Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-brand">
                    <i class="bi bi-heart-pulse"></i>
                    <span>HMBMT APP</span>
                </a>
            </div>
            
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a class="sidebar-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">
                        <i class="bi bi-speedometer2 icon-overview"></i>
                        <span>Overview</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link {% if request.endpoint == 'patients' %}active{% endif %}" href="/patients">
                        <i class="bi bi-people icon-patients"></i>
                        <span>Patients</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link {% if request.endpoint == 'mutations' %}active{% endif %}" href="/mutations">
                        <i class="bi bi-virus icon-mutations"></i>
                        <span>Mutations</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link {% if request.endpoint == 'assays' %}active{% endif %}" href="/assays">
                        <i class="bi bi-clipboard2-pulse icon-assays"></i>
                        <span>Assays</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link {% if request.endpoint == 'chimerism' %}active{% endif %}" href="/chimerism">
                        <i class="bi bi-droplet-half icon-chimerism"></i>
                        <span>Chimerism</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link {% if request.endpoint == 'ecog' %}active{% endif %}" href="/ecog">
                        <i class="bi bi-activity icon-ecog"></i>
                        <span>ECOG PS</span>
                    </a>
                </li>
            </ul>
            
            <!-- ADDED: Logo in sidebar footer -->
            <div class="sidebar-footer">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Johns Hopkins Medicine" class="sidebar-logo">
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <!-- REMOVED: Top Header Bar section completely -->
            
            <!-- Page Content -->
            <main class="content-wrapper">
                {% block content %}{% endblock %}
            </main>

            <!-- Footer -->
            <footer class="content-footer">
                <div class="text-center text-muted small">          
                </div>
            </footer>
        </div>
    </div>

    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Sidebar toggle for mobile
        document.getElementById('sidebarToggle')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        });
        
        document.getElementById('sidebarOverlay')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('show');
            this.classList.remove('show');
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
